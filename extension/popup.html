<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIELD_AI - Malicious Website Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.8;
    }

    .shield-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .content {
      padding: 20px;
    }

    .url-display {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      word-break: break-all;
      font-size: 12px;
      font-family: monospace;
      max-height: 60px;
      overflow-y: auto;
    }

    .result-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .result-box.safe {
      background: rgba(40, 167, 69, 0.3);
      border: 2px solid #28a745;
    }

    .result-box.warning {
      background: rgba(255, 193, 7, 0.3);
      border: 2px solid #ffc107;
    }

    .result-box.danger {
      background: rgba(220, 53, 69, 0.3);
      border: 2px solid #dc3545;
    }

    .result-box.analyzing {
      background: rgba(23, 162, 184, 0.3);
      border: 2px solid #17a2b8;
    }

    .result-box.error {
      background: rgba(108, 117, 125, 0.3);
      border: 2px solid #6c757d;
    }

    .result-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .result-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .result-details {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .confidence-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #fff;
      color: #667eea;
    }

    .btn-primary:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      margin-top: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.online {
      background: #28a745;
    }

    .status-dot.offline {
      background: #dc3545;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .footer {
      padding: 15px 20px;
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .feature-list {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 10px;
      text-align: left;
      padding: 10px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 6px;
    }

    .feature-list div {
      margin-bottom: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="shield-icon">🛡️</div>
    <h1>SHIELD_AI</h1>
    <p>AI-Powered Phishing Detection</p>
  </div>

  <div class="content">
    <div class="url-display" id="currentUrl">
      Loading URL...
    </div>

    <!-- Analyzing State -->
    <div id="analyzingState" class="result-box analyzing hidden">
      <div class="spinner"></div>
      <div class="result-title">Analyzing...</div>
      <div class="result-details">Checking URL for phishing indicators</div>
    </div>

    <!-- Result State -->
    <div id="resultState" class="result-box hidden">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-details" id="resultDetails"></div>
      <div class="confidence-bar">
        <div class="confidence-fill" id="confidenceFill"></div>
      </div>
      <div class="result-details" id="confidenceText"></div>
      <div class="feature-list" id="featureList"></div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="result-box error hidden">
      <div class="result-icon">⚠️</div>
      <div class="result-title">Analysis Failed</div>
      <div class="result-details" id="errorMessage"></div>
    </div>

    <!-- Buttons -->
    <button class="btn btn-primary" id="analyzeBtn">
      🔍 Analyze Current Page
    </button>
    <button class="btn btn-secondary" id="settingsBtn">
      ⚙️ Settings
    </button>

    <!-- API Status -->
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Checking API status...</span>
    </div>
  </div>

  <div class="footer">
    SHIELD_AI v1.0.0 | Powered by Machine Learning
  </div>

  <script src="popup.js"></script>
</body>
</html>
